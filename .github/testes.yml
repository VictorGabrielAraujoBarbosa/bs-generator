name: Build and Test Pipeline

# PASSO 2: Executar automaticamente a cada commit
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Testar em ${{ matrix.os }} com Python ${{ matrix.python-version }}
    
    # PASSOS 3 e 4: Configuração da Matriz (Sistemas e Versões)
    strategy:
      matrix:
        # Passo 3: Executar em Ubuntu, MacOS e Windows
        os: [ubuntu-latest, macos-latest, windows-latest]
        
        # Passo 4: Executar em pelo menos duas versões da linguagem
        python-version: ["3.10", "3.12"]

    # Aqui dizemos para o GitHub usar o SO atual do loop da matriz
    runs-on: ${{ matrix.os }}

    steps:
    - name: Baixar o código do repositório (Checkout)
      uses: actions/checkout@v4

    - name: Configurar o Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install pytest # Mude isso se usar outro framework, como unittest ou jest (em Node)

    - name: Executar os testes
      run: |
        pytest # Comando que roda os testes da sua aplicação
